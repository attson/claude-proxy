name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all platforms
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          build() {
            local goos=$1 goarch=$2 ext=$3
            local name="claude-proxy-${goos}-${goarch}${ext}"
            echo "building ${name}"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${name}" .
            # 打包:Windows 用 zip,其余用 tar.gz
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -q "claude-proxy-${VERSION}-${goos}-${goarch}.zip" "${name}" && rm "${name}")
            else
              (cd dist && tar -czf "claude-proxy-${VERSION}-${goos}-${goarch}.tar.gz" "${name}" && rm "${name}")
            fi
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

      - name: Checksums
        run: (cd dist && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
